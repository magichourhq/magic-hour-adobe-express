name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check if package.json version changed
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r .version)
          VERSION=$(jq -r .version package.json)
          CHANGED=false
          if [ "$OLD_VERSION" != "$VERSION" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CHANGED=true
          fi
          {
            echo "CHANGED=$CHANGED"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Check manifest version matches
        if: env.CHANGED == 'true'
        run: |
          # Adobe's manifest takes a plain x.y.z version, so a dev build like 0.1.0-dev.1 matches 0.1.0.
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$MANIFEST_VERSION" != "${VERSION%%-*}" ]; then
            echo "manifest.json version $MANIFEST_VERSION does not match package.json version $VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CHANGED == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - if: env.CHANGED == 'true'
        run: yarn install --immutable
      - if: env.CHANGED == 'true'
        run: yarn build
      - name: Zip the add-on
        if: env.CHANGED == 'true'
        run: (cd dist && zip -r "../magic-hour-adobe-express-$VERSION.zip" .)
      - name: Create GitHub release
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          # A version like 0.1.0-dev.1 is a test build, so mark it as a prerelease.
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${PRERELEASE[@]}" \
            --generate-notes \
            "magic-hour-adobe-express-$VERSION.zip"
